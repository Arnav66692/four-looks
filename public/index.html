<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Looks</title>
  <link rel="stylesheet" href="kb.css">
</head>
<body>
  <header id="top">
    <div id="textbox" aria-live="polite"><span id="done"></span><span id="typing"></span><i id="caret"></i></div>
    <aside id="cam">
      <video id="video" playsinline muted></video>
      <p id="status">camera off</p>
    </aside>
  </header>
  <nav id="chips"></nav>
  <main id="keys"></main>
  <footer id="bar">
    <p id="prompt">loading the word model</p>
    <button id="start">start camera</button>
    <button id="calibrate">calibrate</button>
    <a href="/boxes.html">4 box mode</a>
  </footer>
  <div id="cursor"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="track"/><circle cx="22" cy="22" r="18" class="fill" id="ring"/></svg></div>
  <div id="target"></div>
  <script type="module" src="kb.js"></script>
</body>
</html>
