<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Looks</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500;600&family=Jost:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="kb.css">
</head>
<body>
  <section id="admin" aria-label="Admin view"></section>
  <header id="top">
    <div id="textbox" aria-live="polite"><span id="done"></span><span id="typing"></span><i id="caret"></i><span id="ghost"></span><span id="ghostmore"></span></div>
    <button id="grokbtn" data-key="grokmode" title="Grok. Blink three times."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg><span class="blinks"><i></i><i></i><i></i></span></button>
    <div id="presence"><span id="status">camera off</span><i id="meter" title="Your press move against its line"></i></div>
    <video id="video" playsinline muted></video>
  </header>
  <nav id="chips"></nav>
  <main id="keys"></main>
  <footer id="bar"><p id="prompt" class="show">loading the word model</p><button id="stats" title="Save this session's log"></button></footer>
  <aside id="menu" aria-label="Settings"></aside>
  <div id="cursor"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" class="track"/><circle cx="20" cy="20" r="16" class="fill" id="ring"/><circle cx="20" cy="20" r="4.5" class="dot"/></svg></div>
  <button id="close" hidden aria-label="Close Four Looks" title="Close (Control+Option+Q)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="target"></div>
  <div id="rawdot"></div>
  <div id="studybox"></div>
  <div id="dock" aria-label="Four Looks dock">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="4.5"/><circle cx="32" cy="32" r="3.2" fill="currentColor"/><circle cx="32" cy="7" r="4" fill="currentColor"/><circle cx="57" cy="32" r="4" fill="currentColor"/><circle cx="32" cy="57" r="4" fill="currentColor"/><circle cx="7" cy="32" r="4" fill="currentColor"/></svg>
    <span class="hint">open your mouth to click · shake twice to switch apps</span>
    <button data-key="grokmode" title="Grok. Blink three times."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></button>
    <button data-key="dock:stop" title="Stop Grok"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
    <button data-key="dock:keyboard" title="Show the keyboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7 14h10"/></svg></button>
    <button data-key="dock:quit" title="Quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="cuebar" aria-hidden="true"></div>
  <script type="module" src="kb.js"></script>
</body>
</html>
